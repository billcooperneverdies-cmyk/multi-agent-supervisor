"""Slack 频道配置 — 团队通信矩阵。

每个代理有特定的频道职责：
- #general: 所有代理的全局通知、任务分配、完成验收
- #frontend: Bob 前端开发的日常更新、阻塞报告
- #backend: Charlie 后端开发的 API 文档、数据库更新
- #qa: Diana 代码审查报告、Bug 追踪、测试进度
- #alerts: 系统告警、人工介入请求
"""

channels:
  general:
    id: C1234567890
    name: "#general"
    description: "全局通知频道 — 任务分配、完成验收、跨团队协调"
    members: [alice, bob, charlie, diana]
    
  frontend:
    id: C2345678901
    name: "#frontend"
    description: "前端开发频道 — Bob 日常更新、UI 设计讨论、技术选型"
    members: [alice, bob, diana]
    
  backend:
    id: C3456789012
    name: "#backend"
    description: "后端开发频道 — Charlie API 文档、数据库设计、性能讨论"
    members: [alice, charlie, diana]
    
  qa:
    id: C4567890123
    name: "#qa"
    description: "QA 频道 — Diana 审查报告、Bug 追踪、测试自动化"
    members: [alice, bob, charlie, diana]
    
  alerts:
    id: C5678901234
    name: "#alerts"
    description: "告警频道 — 系统异常、人工介入请求、安全事件"
    members: [alice, diana]

message_templates:
  task_assignment:
    format: "📋 **任务分配** | {agent}\n\n**任务**：{task_description}\n**分支**：`{branch}`\n**截止**：{deadline}\n\n@channel 请开始工作！"
    channel: "#general"
    
  daily_update:
    format: "📝 **每日更新** | {agent}\n\n**今日完成**：{completed}\n**明日计划**：{planned}\n**阻塞/风险**：{blockers}\n"
    channel: "#{agent_domain}"
    
  code_review_request:
    format: "🔍 **代码审查请求** | {agent}\n\n**PR**：{pr_url}\n**变更**：{file_changes}\n**测试状态**：{test_status}\n\n@diana 请审查！"
    channel: "#qa"
    
  bug_report:
    format: "🐛 **Bug 报告** | Diana\n\n**严重程度**：{severity}\n**影响**：{impact}\n**位置**：{location}\n**重现步骤**：{repro_steps}\n\n@{assigned_dev} 请修复！"
    channel: "#qa"
    
  approval_notice:
    format: "✅ **功能验收通过** | Diana\n\n**功能**：{feature}\n**PR**：{pr_url}\n**测试覆盖**：{coverage}\n\n@alice 可以合并了！"
    channel: "#general"
    
  completion_notice:
    format: "🎉 **任务完成** | {agent}\n\n**功能**：{feature}\n**PR**：{pr_url}\n**变更文件**：{files}\n\n@alice 请安排验收！"
    channel: "#general"
    
  human_intervention:
    format: "🛑 **需要人工确认** | {agent}\n\n**问题**：{question}\n**上下文**：{context}\n\n请回复：yes/否"
    channel: "#alerts"
