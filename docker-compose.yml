# Multi-Agent Supervisor — Docker Compose
# Orchestrates: LiteLLM Proxy, Postgres+pgvector, Main Agent Service

services:
  # ────────────────────────────────────────────────
  # PostgreSQL with pgvector (Vector Store + Metadata)
  # ────────────────────────────────────────────────
  postgres:
    image: ankane/pgvector:latest
    container_name: agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agent_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-network

  # ────────────────────────────────────────────────
  # LiteLLM Proxy (Model Routing Layer)
  # Unified API for OpenAI, Anthropic, local models
  # ────────────────────────────────────────────────
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: agent-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      # Master key for proxy authentication
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      # Store model config in database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agent_db}
      # OpenAI (default)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Slack / GitHub tokens passed through for tool calling
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    command: >
      --config /app/proxy_config.yaml
      --port 4000
    volumes:
      - ./configs/litellm_proxy.yaml:/app/proxy_config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ────────────────────────────────────────────────
  # MCP Server (Middleware Component Protocol)
  # Exposes GitHub & Slack tools via stdio/SSE
  # ────────────────────────────────────────────────
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: agent-mcp
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
    # stdio transport — used as a sidecar
    # For SSE transport, expose: - "8001:8001"
    networks:
      - agent-network

  # ────────────────────────────────────────────────
  # Main Agent Service (LangGraph Supervisor)
  # ────────────────────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: agent-supervisor
    restart: unless-stopped
    ports:
      - "${AGENT_PORT:-8000}:8000"
    environment:
      # LiteLLM Proxy endpoint
      LITELLM_API_BASE: http://litellm-proxy:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      # Postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agent_db}
      # MCP Server (stdio pipe or SSE endpoint)
      MCP_SERVER_CMD: python -m mcp_server.main
      # Slack / GitHub (for direct API calls if needed)
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      litellm-proxy:
        condition: service_healthy
    networks:
      - agent-network

  # ────────────────────────────────────────────────
  # Redis (Optional — for LangGraph checkpoint persistence)
  # ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - agent-network

volumes:
  postgres_data:
  redis_data:

networks:
  agent-network:
    driver: bridge
