# Multi-Agent Supervisor — Docker Compose
# Orchestrates: LiteLLM Proxy, Postgres+pgvector, Main Agent Service

services:
  # ────────────────────────────────────────────────
  # PostgreSQL with pgvector (Vector Store + Metadata)
  # ────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    container_name: agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # REQUIRED, no default (BUG-006): postgres/postgres must never boot.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port intentionally NOT published on the host (BUG-006): the database is
    # reachable only on the internal agent-network. For local debugging,
    # uncomment to bind on localhost only:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agent_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-network

  # ────────────────────────────────────────────────
  # LiteLLM Proxy (Model Routing Layer)
  # Unified API for OpenAI, Anthropic, local models
  # ────────────────────────────────────────────────
  litellm-proxy:
    image: ghcr.io/berriai/litellm:v1.108.0
    container_name: agent-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      # Master key for proxy authentication — REQUIRED, no default (BUG-005)
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set (see .env.example)}
      # Store model config in database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-agent_db}
      # OpenAI (default)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Anthropic — required by the claude-3-5-sonnet entry in
      # configs/litellm_proxy.yaml (os.environ/ANTHROPIC_API_KEY); previously
      # referenced but never plumbed into this container (BUG-024).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # NOTE (BUG-021): GITHUB_TOKEN / SLACK_BOT_TOKEN are deliberately NOT
      # passed to this container — the proxy never consumes them. They live
      # only in the agent service, which spawns the MCP tool server.
    command: >
      --config /app/proxy_config.yaml
      --port 4000
    volumes:
      - ./configs/litellm_proxy.yaml:/app/proxy_config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ────────────────────────────────────────────────
  # MCP Server — NO standalone service (BUG-025)
  # The MCP tool server speaks stdio, which cannot cross container boundaries:
  # a sidecar container with closed stdin can never serve the agent. Instead,
  # the AGENT service spawns it in-process via MCP_SERVER_CMD (see below).
  # Dockerfile.mcp remains for standalone/dev use.
  # ────────────────────────────────────────────────

  # ────────────────────────────────────────────────
  # Main Agent Service (LangGraph Supervisor)
  # ────────────────────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: agent-supervisor
    restart: unless-stopped
    ports:
      - "${AGENT_PORT:-8000}:${AGENT_PORT:-8000}"
    environment:
      # In-container uvicorn/healthcheck port (matches the published port)
      AGENT_PORT: ${AGENT_PORT:-8000}
      # BUG-045: the code default is loopback; container use opts into 0.0.0.0.
      AGENT_HOST: 0.0.0.0
      # API key for all /tasks/* endpoints (X-API-Key header) — REQUIRED, no
      # default (BUG-007); the app refuses to start without it.
      AGENT_API_KEY: ${AGENT_API_KEY:?AGENT_API_KEY must be set (see .env.example)}
      # Task-run deadline / concurrency cap (BUG-016)
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-300}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-4}
      # LiteLLM Proxy endpoint
      LITELLM_API_BASE: http://litellm-proxy:4000
      # Key the agent presents to the proxy — REQUIRED, no default (BUG-005)
      LITELLM_API_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY must be set (see .env.example)}
      # Postgres (LangGraph checkpointer)
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-agent_db}
      # MCP tool server: spawned IN-PROCESS by the agent as a stdio
      # subprocess (BUG-025); mcp_server/ is copied into this image.
      MCP_SERVER_CMD: python -m mcp_server.main
      # Slack / GitHub tokens — consumed by the spawned MCP tool server
      # (inherited into its subprocess environment).
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      litellm-proxy:
        condition: service_healthy
    networks:
      - agent-network

  # NOTE (BUG-024): the redis service was removed — re-verified against current
  # code, it has zero consumers (checkpointing uses DATABASE_URL/Postgres or
  # in-memory; see orchestrator/state_machine.py get_checkpointer).

volumes:
  postgres_data:

networks:
  agent-network:
    driver: bridge
