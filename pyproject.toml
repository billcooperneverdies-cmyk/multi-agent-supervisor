[project]
name = "multi-agent-supervisor"
version = "0.3.0"
description = "Multi-Agent AI Software Development Team"
requires-python = ">=3.10"
dependencies = [
    # ── Core ──
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.0",
    "fastapi>=0.110.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    # ── Shared infrastructure (multi-worker safe) ──
    "redis[hiredis]>=5.0",
    "asyncpg>=0.29.0",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "asgi-lifespan>=2.1",
    "fakeredis>=2.21",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
