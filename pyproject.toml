[project]
name = "multi-agent-supervisor"
version = "0.1.0"
description = "Multi-Agent Supervisor: LangGraph + MCP + LiteLLM architecture"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.28,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
    "langgraph>=1.0,<2",
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.2,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5.0,<8",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator", "mcp_server", "agents"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
